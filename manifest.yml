modules:
  action:
    - key: find-asset
      name: Find asset
      function: findAsset
      actionVerb: GET
      description: Finds factory machines by hostname, nickname, IP address, old IP, former name or model. Returns up to five candidates with their asset ids, never one guess.
      inputs:
        query:
          title: Query
          type: string
          required: true
          description: The words the user used for the machine, for example Old Faithful, birch-l2-cp-04 or 10.1.2.13.
    - key: explain-asset
      name: Explain asset
      function: explainAsset
      actionVerb: GET
      description: Everything known and not known about one machine, the sources searched, linked pages and tickets, people, findings and the knowledge, risk and danger scores.
      inputs:
        assetId:
          title: Asset id
          type: string
          required: true
          description: Pentti asset id such as a_d4mjq, taken from find-asset or gap-report. Never invent one.
    - key: blast-radius
      name: Blast radius
      function: blastRadius
      actionVerb: GET
      description: Other machines on the same line and in the same subnet as one machine, with criticality, open findings and danger. Reachability is not verified.
      inputs:
        assetId:
          title: Asset id
          type: string
          required: true
          description: Pentti asset id such as a_d4mjq, taken from find-asset or gap-report. Never invent one.
    - key: who-knows
      name: Who knows
      function: whoKnows
      actionVerb: GET
      description: People who touched one machine in pages or tickets, most recent first, with a flag when someone is leaving or has left.
      inputs:
        assetId:
          title: Asset id
          type: string
          required: true
          description: Pentti asset id such as a_d4mjq, taken from find-asset or gap-report. Never invent one.
    - key: gap-report
      name: Gap report
      function: gapReport
      actionVerb: GET
      description: The closing list. The machines to document first for a plant or the whole factory, with hours per step, the total hours and the percent of danger removed.
      inputs:
        plant:
          title: Plant
          type: string
          required: false
          description: Plant name (Birch, Spruce, Rowan, Pine, Alder, Annex) or all. Default all.
        n:
          title: Number of assets
          type: integer
          required: false
          description: How many assets to list, 1 to 25. Default 10.
    - key: create-gap-tasks
      name: Create gap tasks
      function: createGapTasks
      actionVerb: CREATE
      description: Creates one Jira task per machine to close its knowledge gap, in the project the factory was loaded into. Idempotent, a machine that already has a task gets the existing key back. Only after the user confirmed the list.
      inputs:
        assetIds:
          title: Asset ids
          type: string
          required: true
          description: Up to 10 Pentti asset ids from gap-report, comma separated, for example a_8bjia,a_d4mjq.
  rovo:agent:
    - key: ask-pentti
      name: Ask Pentti
      description: A maintenance veteran's memory for the factory. Says what is known about a machine, what is not, and where it looked.
      prompt: |
        You are Pentti, a maintenance veteran's memory for a factory. You answer questions about machines.
        Rules:
        - Use only what the actions return. Never use your own knowledge to fill a gap about a specific machine.
        - Always answer in three parts: What is known (with source ids), What is not known, Where I looked.
        - If an action says not_known, say so plainly. "Nobody knows" is a valid answer.
        - If a query matches several machines, list them and ask which one. Never pick.
        - Keep it short. Dry is fine. Jokes about the machine are fine, jokes about the numbers are not.
        - Numbers come from the action output. Do not round, estimate or invent them.
        - Before creating Jira tasks, show the list and ask for confirmation.

        How to work:
        - A machine named by the user: call find-asset with the words they used. One candidate: go on with its assetId. Several: list them with plant, line and role, ask which one. None: say nobody knows that name, and say what was searched.
        - To explain a machine: call explain-asset with the assetId. Known facts come from the known part, each with its label: SCAN for the scan, GEN for pages, tickets and people, SCORE for knowledge, risk and danger. Give page and ticket titles with their links or ids. Not known comes from the not_known list, every line of it. Where I looked comes from the searched list.
        - Write every machine name as a markdown link to the url the action gives for that machine, like [birch-l2-cp-04 (Old Faithful)](url). When url is null, write the name without a link. Never build a url yourself.
        - Items under maybe are mentions the matcher is not sure about. Name them as maybe, never as known.
        - "What happens if it dies", "what else is affected": also call blast-radius and repeat its sentence word for word.
        - "Who knows it", "who to call": call who-knows. Say when someone is leaving or has left.
        - "What should we document first", "closing list", "gap report": call gap-report with a plant name or all, n is 10 unless the user says otherwise. Show rank, name, hours and steps, then the sentence it returns.
        - Creating tasks: show the assets, hours and the total from gap-report, ask "Create these tasks?", and only after a yes call create-gap-tasks with the assetIds, comma separated. Then list the issue keys with their links. Tasks that already existed are not new, say so.
        - Never add up, average or convert numbers yourself. Use the totals the actions give.
        - People are fictional and have no Atlassian account. Write their names as plain text, never as an @mention, and refer to them by name, not by he or she.
        - Tervaniemi Works is a fictional company and its people are generated. The machines come from a real, anonymized scan. Say so when asked.
        - Write plain sentences. No exclamation marks.
      conversationStarters:
        - What happens if Old Faithful dies?
        - Which machines are Critical and nobody knows anything about?
        - Who knows the most about Birch line 2?
        - Give me ten assets to fix this quarter.
      actions:
        - find-asset
        - explain-asset
        - blast-radius
        - who-knows
        - gap-report
        - create-gap-tasks
  rovo:mcp:
    - key: pentti-mcp
      name: Pentti
      tools:
        - find-asset
        - explain-asset
        - gap-report
  graph:connector:
    - key: pentti-assets
      name: Pentti asset cards
      icons:
        light: https://cdn.jsdelivr.net/gh/apn201/Pentti@a28d785d04c7d4f7880988b54696696114c3b284/static/connector-icon.svg
        dark: https://cdn.jsdelivr.net/gh/apn201/Pentti@a28d785d04c7d4f7880988b54696696114c3b284/static/connector-icon.svg
      objectTypes:
        - atlassian:document
      capabilities:
        replicatesPermissions: false
        syncFidelity: mirror
        supportsIncrementalSync: false
      datasource:
        onConnectionChange:
          function: onConnectionChange
  jira:globalPage:
    - key: pentti-app
      title: Pentti
      resource: app
      resolver:
        function: appResolver
  jira:adminPage:
    - key: pentti-admin
      title: Pentti
      resource: admin
      resolver:
        function: adminResolver
  function:
    - key: onConnectionChange
      handler: index.onConnectionChange
    - key: adminResolver
      handler: index.adminResolver
    - key: appResolver
      handler: index.appResolver
    - key: findAsset
      handler: index.findAssetAction
    - key: explainAsset
      handler: index.explainAssetAction
    - key: blastRadius
      handler: index.blastRadiusAction
    - key: whoKnows
      handler: index.whoKnowsAction
    - key: gapReport
      handler: index.gapReportAction
    - key: createGapTasks
      handler: index.createGapTasksAction
resources:
  - key: admin
    path: static/admin/dist
  - key: app
    path: static/app/dist
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/d2fcbee5-3e1f-41db-8db4-e4360bef4b93
  compatibility:
    jira:
      required: true
    confluence:
      required: false
permissions:
  scopes:
    - write:jira-work
    - read:jira-work
    - storage:app
    - read:object:jira
    - write:object:jira
    - delete:object:jira
    - read:space:confluence
    - read:page:confluence
    - write:page:confluence
    - delete:page:confluence
    - read:label:confluence
    - write:label:confluence
    - search:confluence
    - read:content-details:confluence
