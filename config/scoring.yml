  owner: 20
  owner_leaving: 8       # owner counts for less when they leave soon
  doc: 25
  doc_fresh: 15
  history: 15
  firmware: 5
  confirmed: 10
windows_months:
  owner_activity: 24
  doc_fresh: 18
  history: 36
  confirmed: 12
